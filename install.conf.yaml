- defaults:
    link:
      relink: true
      force: true

- clean: ['~']

- link:
    ~/.bashrc: bashrc
    ~/.zshrc: zshrc
    ~/.vimrc: vimrc
    ~/.aliases: aliases
    ~/.functions: functions
    ~/.gitconfig: gitconfig
    ~/.gitconfig-work: gitconfig-work
    ~/.gitignore: gitignore
    ~/.work: work
    ~/.wakeup: wakeup
    ~/.tmux.conf: tmux.conf
    ~/.p10k.zsh: p10k.zsh
    ~/.local/bin/meshclaw-catchup.sh: scripts/meshclaw-catchup.sh
    ~/.claude/skills/writing-style:
      path: claude/skills/writing-style
      create: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - ['defaults write com.googlecode.iterm2 PrefsCustomFolder -string "$HOME/dotfiles/iterm2" && defaults write com.googlecode.iterm2 LoadPrefsFromCustomFolder -bool true', Configuring iTerm2 to load prefs from dotfiles]

- brewfile:
    - Brewfile

- vscodefile:
    file: Vscodefile
    insiders: false

- crontab:
    - cron: "*/15 * * * *"
      command: /home/pmaloo/.local/bin/meshclaw-catchup.sh >/dev/null 2>&1
      comment: meshclaw-catchup
