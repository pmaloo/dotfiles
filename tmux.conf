set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse (tmux 2.1+ unified option; brew tmux is 3.x)
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1

bind | split-window -h
bind - split-window -v
bind r source-file ~/.tmux.conf \; display 'Config reloaded'

set -g history-limit 50000
set -sg escape-time 10
set -g default-terminal 'screen-256color'

# ── Plugins (managed by tpm) ──────────────────────────────────────────
# Survive Cloud Desktop kernel-patch reboots: continuum autosaves session
# state every 15 min and resurrect restores it on the next tmux start.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'   # restore visible pane output
set -g @continuum-restore 'on'                  # auto-restore on tmux start
set -g @continuum-save-interval '15'            # autosave every 15 minutes

# Keep tpm run line LAST.
run '~/.tmux/plugins/tpm/tpm'
